name: Release build (MSVC)

on:
  workflow_dispatch:
  push:
    branches: [ release-build ]

permissions:
  contents: write

jobs:
  msvc-win32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force "$out/Drivers" | Out-Null
          Get-ChildItem build -Recurse -Include nfs5_enhanced.asi, SDL3.dll | Where-Object { $_.FullName -notmatch '\\drivers\\' } | Copy-Item -Destination $out
          Get-ChildItem build -Recurse -Filter dx11z.dll | Copy-Item -Destination "$out/Drivers"
          Copy-Item config/nfs5_enhanced.ini, config/DDrawCompat.ini, README.md, CHANGELOG.md, LICENSE -Destination $out
          Copy-Item -Recurse GameplayFixes "$out/GameplayFixes"
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: nfs5_enhanced-msvc-${{ github.sha }}
          path: package

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath nfs5_enhanced-msvc.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = "${{ github.sha }}".Substring(0,7)
          $tag = "build-$short"
          $notes = "Unofficial MSVC build of upstream master (8b7acf6) plus PR #32 (stereo fix on mirrored tracks). Includes every change merged after v1.3.0: headlight flicker fix (#13), fog fix (#23), floating scenery (#16), GT1 bumper camera (#25), anisotropy 16x default (#26), scrollbar fix (#27), relocated image base / ASLR (#28), movie upscaling (#31), Essentials V2 gameplay redirect (#21)."
          gh release create $tag nfs5_enhanced-msvc.zip --repo ${{ github.repository }} --target ${{ github.sha }} --title "MSVC build $short (master + PR #32)" --notes $notes --prerelease
